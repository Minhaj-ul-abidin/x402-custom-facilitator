version: '3.8'

services:
  x402-facilitator:
    build: .
    container_name: x402-facilitator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - FACILITATOR_PRIVATE_KEY=${FACILITATOR_PRIVATE_KEY}
      - EVM_PRIVATE_KEY=${EVM_PRIVATE_KEY}
      - SVM_PRIVATE_KEY=${SVM_PRIVATE_KEY}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  x402-network:
    driver: bridge

volumes:
  logs:
  data:
